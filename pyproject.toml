[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi"
version = "0.1.0"
description = "Lumi: a tiny functional + logic programming language for learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lumi = "lumi.__main__:main"

[tool.setuptools]
packages = ["lumi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
